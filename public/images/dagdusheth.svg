<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with warm gradient -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16" />
  <circle cx="300" cy="170" r="190" fill="url(#glowGrad)" />

  <!-- Traditional arch / halo pattern -->
  <circle cx="300" cy="165" r="110" fill="none" stroke="#FEF08A" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="300" cy="165" r="125" fill="none" stroke="#FEF08A" stroke-width="1" opacity="0.3"/>

  <!-- Subtle corner decorative flourish -->
  <path d="M 25 50 Q 50 50 50 25 M 35 60 Q 60 60 60 35" stroke="#FEF08A" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 575 50 Q 550 50 550 25 M 565 60 Q 540 60 540 35" stroke="#FEF08A" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Central Emblem / Icon container -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="165" r="75" fill="#FFFFFF" fill-opacity="0.12" stroke="#FEF08A" stroke-width="3" />
    <text x="300" y="195" font-size="76" text-anchor="middle" font-family="system-ui, sans-serif">✨</text>
  </g>

  <!-- Badge at top right -->
  <g transform="translate(430, 26)">
    <rect width="145" height="34" rx="17" fill="#000000" fill-opacity="0.4" stroke="#FEF08A" stroke-width="1.5"/>
    <text x="72" y="22" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FEF08A" text-anchor="middle">नवसाचा राजा</text>
  </g>

  <!-- Text info container at bottom with slight dark gradient backdrop -->
  <rect x="0" y="275" width="600" height="125" rx="16" fill="#000000" fill-opacity="0.4" />

  <!-- Titles in clean Devanagari -->
  <text x="300" y="325" font-family="'Noto Sans Devanagari', -apple-system, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">श्रीमंत दगडूशेठ हलवाई</text>
  <text x="300" y="360" font-family="'Noto Sans Devanagari', -apple-system, system-ui, sans-serif" font-size="16" font-weight="500" fill="#FEF08A" text-anchor="middle">प्रमुख गणपती • नवसाचा राजा</text>
</svg>